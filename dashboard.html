<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 — 짱구's Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<style>
[data-theme="dark"]{--purple:#b392f0;}
[data-theme="light"]{--purple:#8250df;}

@media(min-width:1024px){#pwa-banner-area{max-width:1280px;}}

/* 인사말 */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:.75rem 1.5rem;margin-bottom:1rem;}
.dash-head-text{min-width:0;}

/* 디지털 시계 */
.clock{display:flex;align-items:baseline;gap:.15rem;padding:.55rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;line-height:1;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Roboto Mono','Liberation Mono',monospace;font-variant-numeric:tabular-nums;}
.clk-main{font-size:2.4rem;font-weight:700;letter-spacing:.02em;color:var(--text);}
.clk-sec{font-size:1.3rem;font-weight:600;color:var(--accent);}
.clk-colon{animation:clk-blink 1s steps(1) infinite;}
@keyframes clk-blink{50%{opacity:.25;}}
@media(max-width:767px){
  .clock{width:100%;justify-content:center;padding:.5rem .8rem;}
  .clk-main{font-size:2.2rem;}
}
.dash-date{font-size:.8rem;color:var(--text-muted);}
.dash-title{font-size:1.5rem;font-weight:700;margin-top:.15rem;}

/* 마감 임박 배너 */
.banner{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.75rem 1rem;margin-bottom:1.25rem;border-radius:12px;background:color-mix(in srgb,var(--danger) 10%,transparent);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);}
.banner-ico{display:flex;color:var(--danger);}
.banner-title{font-size:.85rem;font-weight:700;color:var(--danger);}
.banner-chips{display:flex;gap:.5rem;flex-wrap:wrap;flex:1 1 14rem;min-width:0;}
.banner-chips a{display:inline-flex;align-items:center;min-height:32px;padding:0 .8rem;border-radius:16px;background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--text);font-size:.78rem;text-decoration:none;}
.banner-chips a b{color:var(--danger);margin-left:.4rem;}

/* 전체 배치: 좁으면 1열, 1200px 이상이면 본문 + 우측 패널 */
.dash-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem;}
@media(min-width:1200px){.dash-layout{grid-template-columns:minmax(0,1fr) 320px;}}
.dash-side{display:flex;flex-direction:column;gap:1.25rem;}

.tools-label{font-size:.78rem;font-weight:700;color:var(--text-muted);margin-bottom:.5rem;}
.tools{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:.5rem;margin-bottom:1.25rem;}
@media(min-width:768px){.tools{grid-template-columns:repeat(var(--n,5),6.5rem);justify-content:start;gap:.6rem;}}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-height:72px;padding:.55rem .25rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text);font-size:.74rem;font-weight:600;line-height:1.2;transition:border-color .15s;}
.tool:hover{border-color:var(--accent);}
.tool-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent);}
.tool-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
[data-theme="dark"] .tool-gemini{--tc:#8ab4f8;}   [data-theme="light"] .tool-gemini{--tc:#1967d2;}
[data-theme="dark"] .tool-chatgpt{--tc:#3ecf9e;}  [data-theme="light"] .tool-chatgpt{--tc:#0f7b5f;}
[data-theme="dark"] .tool-claude{--tc:#e08a67;}   [data-theme="light"] .tool-claude{--tc:#b5532f;}
[data-theme="dark"] .tool-notion{--tc:#e6edf3;}   [data-theme="light"] .tool-notion{--tc:#1f2328;}
.tool-icqa{--tc:var(--purple);}

/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-bottom:1.25rem;}
@media(min-width:768px){.stat-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem 1rem;}
.stat-card h3{font-size:.78rem;font-weight:500;color:var(--text-muted);}
.stat-value{font-size:1.8rem;font-weight:700;line-height:1.25;margin-top:.15rem;}
.stat-sub{font-size:.72rem;color:var(--text-muted);}

/* 패널 */
.panel-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem;}
@media(min-width:900px){.panel-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;min-width:0;}
.panel-head{display:flex;justify-content:space-between;align-items:center;min-height:32px;margin-bottom:.4rem;gap:.5rem;}
.panel-head h2{font-size:.95rem;font-weight:700;}
.panel-link{font-size:.8rem;color:var(--accent);text-decoration:none;padding:.5rem 0;white-space:nowrap;}
.panel-note{font-size:.72rem;color:var(--text-muted);}

/* 칩 */
.chip{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
.chip-danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger);}
.chip-warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning);}
.chip-ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.chip-muted{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}

/* 목록 행 */
.row{display:flex;align-items:center;gap:.75rem;min-height:48px;border-top:1px solid var(--border);font-size:.875rem;}
.rows > .row:first-child{border-top:none;}
.chk-hit{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 0 0 -.65rem;flex-shrink:0;cursor:pointer;}
.chk{width:20px;height:20px;padding:0;margin:0;accent-color:var(--success);cursor:pointer;}
.t-text{flex:1;min-width:0;overflow-wrap:anywhere;}
.t-time{font-size:.75rem;color:var(--text-muted);flex-shrink:0;}
.todo-row.done .t-text{text-decoration:line-through;color:var(--text-muted);}
.more-note{font-size:.78rem;color:var(--text-muted);padding-top:.6rem;border-top:1px solid var(--border);}

/* 프로젝트 미리보기 */
.proj-mini{display:block;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem;margin-bottom:.6rem;text-decoration:none;color:inherit;}
.proj-mini:last-child{margin-bottom:0;}
.proj-mini-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem;}
.proj-mini-title{font-size:.86rem;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;}
.proj-mini-row{display:flex;align-items:center;gap:.6rem;}
.proj-mini-row .progress-bar{flex:1;margin-top:0;height:6px;border-radius:3px;}
.proj-mini-pct{font-size:.72rem;color:var(--text-muted);flex-shrink:0;}

/* 파일 */
.file-row{display:flex;align-items:center;gap:.75rem;min-height:48px;border-top:1px solid var(--border);}
.rows > .file-row:first-child{border-top:none;}
.file-ico{width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.file-main{flex:1;min-width:0;}
.file-main .n{font-size:.84rem;font-weight:500;overflow-wrap:anywhere;}
.file-main .m{font-size:.72rem;color:var(--text-muted);}

/* 민원 유형 막대 */
.bar-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.8rem;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{width:5.5rem;font-size:.8rem;color:var(--text-muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);}
.bar-num{width:1.6rem;text-align:right;font-size:.8rem;font-weight:600;}

/* 오늘 일정 */
.ev{display:flex;gap:.8rem;align-items:flex-start;padding:.65rem .8rem;margin-bottom:.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;}
.ev:last-child{margin-bottom:0;}
.ev-time{width:3.4rem;font-size:.78rem;font-weight:700;color:var(--accent);flex-shrink:0;padding-top:1px;}
.ev-title{font-size:.84rem;min-width:0;overflow-wrap:anywhere;}
</style>
</head>
<body>
<div id="main-section" style="display:none">
  <div class="container wide">

    <div class="dash-head">
      <div class="dash-head-text">
        <div class="dash-date" id="dash-date"></div>
        <h1 class="dash-title" id="dash-greeting"></h1>
      </div>
      <!-- 숫자는 1초마다 바뀌므로 화면 낭독기에는 읽히지 않게 하고, 분이 바뀔 때만 라벨을 갱신 -->
      <div class="clock" id="dash-clock" role="img" aria-label="현재 시각">
        <span class="clk-main" aria-hidden="true"><span id="clk-h">--</span><span class="clk-colon">:</span><span id="clk-m">--</span></span>
        <span class="clk-sec" aria-hidden="true">:<span id="clk-s">--</span></span>
      </div>
    </div>

    <!-- 마감 임박 경고 -->
    <div id="deadline-warning"></div>

    <div class="dash-layout">
      <div class="dash-main">

        <!-- 바로가기 (목록은 common.js 의 TOOL_LINKS) -->
        <div class="tools-label" id="tools-label">바로가기</div>
        <nav class="tools" id="dash-tools" aria-labelledby="tools-label"></nav>

        <!-- 통계 -->
        <div class="stat-grid">
          <div class="stat-card">
            <h3>오늘 할일</h3>
            <div class="stat-value" id="stat-todo" style="color:var(--accent)">-</div>
            <div class="stat-sub" id="stat-todo-sub">로딩 중...</div>
          </div>
          <div class="stat-card">
            <h3>미완료 할일</h3>
            <div class="stat-value" id="stat-incomplete" style="color:var(--warning)">-</div>
            <div class="stat-sub">이전 날짜 미완료</div>
          </div>
          <div class="stat-card">
            <h3>이번 달 완료</h3>
            <div class="stat-value" id="stat-monthly" style="color:var(--success)">-</div>
            <div class="stat-sub">할일 완료 건수</div>
          </div>
          <div class="stat-card">
            <h3>이번 달 민원</h3>
            <div class="stat-value" id="stat-complaint" style="color:var(--purple)">-</div>
            <div class="stat-sub">민원 이력 건수</div>
          </div>
        </div>

        <div class="panel-grid">
          <section class="panel" aria-labelledby="h-todo">
            <div class="panel-head"><h2 id="h-todo">오늘 할일</h2><a class="panel-link" href="todo.html">전체 보기</a></div>
            <div id="today-todos"><div class="empty">불러오는 중...</div></div>
          </section>

          <section class="panel" aria-labelledby="h-proj">
            <div class="panel-head"><h2 id="h-proj">진행중인 장기프로젝트</h2><a class="panel-link" href="project.html">전체 보기</a></div>
            <div id="dash-projects"><div class="empty">불러오는 중...</div></div>
          </section>

          <section class="panel" aria-labelledby="h-files">
            <div class="panel-head"><h2 id="h-files">최근 업로드 파일</h2><a class="panel-link" href="index.html">자료실</a></div>
            <div id="recent-files"><div class="empty">불러오는 중...</div></div>
          </section>

          <section class="panel" aria-labelledby="h-types">
            <div class="panel-head"><h2 id="h-types">이번 달 민원 유형</h2><a class="panel-link" href="complaint_history.html">민원 이력</a></div>
            <div id="complaint-types"><div class="empty">불러오는 중...</div></div>
          </section>
        </div>
      </div>

      <aside class="dash-side" aria-label="오늘 일정">
        <section class="panel" aria-labelledby="h-cal">
          <div class="panel-head"><h2 id="h-cal">오늘 일정</h2><span class="panel-note">Google 캘린더</span></div>
          <div id="dash-cal"><div class="empty">불러오는 중...</div></div>
        </section>
      </aside>
    </div>

  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  initPage(() => { initDashboard(); });
});
// 빠른 추가로 할일이 생기면 대시보드도 새로고침
window.addEventListener('todo-added', () => { if (currentUser) initDashboard(); });

// ---------- 작은 도우미들 ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// 'YYYY-MM-DD' 를 브라우저 시간대 기준 날짜로 해석 (UTC 로 해석되어 하루 어긋나는 것을 방지)
function parseLocalDate(str) {
  const [y, m, d] = String(str).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function ddayText(diff, long) {
  if (diff === 0) return 'D-Day';
  if (diff < 0) return long ? `D+${-diff} 초과` : `D+${-diff}`;
  return `D-${diff}`;
}
function greetingFor(h) {
  if (h < 6) return '늦은 시간까지 수고 많으세요';
  if (h < 12) return '좋은 아침이에요';
  if (h < 18) return '안녕하세요';
  return '오늘도 수고 많으셨어요';
}
const PRI = {
  high:   { label: '높음', cls: 'chip-danger' },
  medium: { label: '보통', cls: 'chip-warn' },
  low:    { label: '낮음', cls: 'chip-ok' }
};
const EMPTY = msg => `<div class="empty">${msg}</div>`;

let todayTodos = [];
let monthlyDone = 0;

// ---------- 오늘 할일 ----------
function updateTodoStats() {
  const total = todayTodos.length;
  const done = todayTodos.filter(t => t.done).length;
  document.getElementById('stat-todo').textContent = `${done}/${total}`;
  document.getElementById('stat-todo-sub').textContent = total > 0 ? `${total - done}개 남음` : '할일 없음';
}

function renderTodos() {
  const el = document.getElementById('today-todos');
  if (!todayTodos.length) { el.innerHTML = EMPTY('오늘 할일이 없습니다'); return; }
  const MAX = 7;
  const rows = todayTodos.slice(0, MAX).map(t => {
    const p = PRI[t.priority || 'medium'] || PRI.medium;
    return `<div class="row todo-row${t.done ? ' done' : ''}" data-id="${escHtml(t.id)}">
      <label class="chk-hit"><input type="checkbox" class="chk" ${t.done ? 'checked' : ''} aria-label="완료 표시: ${escHtml(t.text)}"></label>
      <span class="t-text">${escHtml(t.text)}</span>
      ${t.start_time ? `<span class="t-time">${escHtml(t.start_time)}</span>` : ''}
      <span class="chip ${p.cls}">${p.label}</span>
    </div>`;
  }).join('');
  const more = todayTodos.length > MAX ? `<div class="more-note">외 ${todayTodos.length - MAX}개는 할일 페이지에서 볼 수 있어요</div>` : '';
  el.innerHTML = `<div class="rows">${rows}</div>${more}`;
  // 체크하면 바로 저장 (이벤트는 덮어써서 중복 등록 방지)
  el.onchange = e => {
    if (!e.target.classList.contains('chk')) return;
    toggleDashTodo(e.target.closest('.row').dataset.id, e.target.checked);
  };
}

async function toggleDashTodo(id, done) {
  const t = todayTodos.find(x => String(x.id) === String(id));
  if (!t) return;
  const prev = t.done;
  t.done = done;                                   // 화면 먼저 반영
  const row = document.querySelector(`#today-todos [data-id="${CSS.escape(String(id))}"]`);
  if (row) row.classList.toggle('done', done);
  updateTodoStats();
  const { error } = await sb.from('todos').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', id);
  if (error) {                                     // 실패하면 되돌림
    t.done = prev; renderTodos(); updateTodoStats();
    showToast('저장하지 못했어요. 다시 시도해 주세요');
    return;
  }
  monthlyDone = Math.max(0, monthlyDone + (done ? 1 : -1));
  document.getElementById('stat-monthly').textContent = monthlyDone;
}

// ---------- 장기프로젝트 ----------
const WARN_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>';
const FILE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

function renderProjects(projList, counts, today0) {
  const projEl = document.getElementById('dash-projects');
  const warnEl = document.getElementById('deadline-warning');
  const pctOf = c => (c.total ? Math.round(c.done / c.total * 100) : 0);

  // 마감 7일 이내 + 진행률 50% 미만
  const warnings = projList.filter(p => {
    if (!p.target_date) return false;
    const diff = Math.round((parseLocalDate(p.target_date) - today0) / 86400000);
    const c = counts[p.id] || { done: 0, total: 0 };
    return diff <= 7 && pctOf(c) < 50;
  });
  if (warnings.length) {
    warnEl.innerHTML = `<div class="banner" role="alert">
      <span class="banner-ico">${WARN_ICON}</span>
      <strong class="banner-title">마감 임박 · 진행률 낮은 프로젝트 ${warnings.length}건</strong>
      <div class="banner-chips">${warnings.map(p => {
        const c = counts[p.id] || { done: 0, total: 0 };
        const diff = Math.round((parseLocalDate(p.target_date) - today0) / 86400000);
        return `<a href="project.html">${escHtml(p.title)}<b>${ddayText(diff, true)}</b><span style="margin-left:.4rem;color:var(--text-muted)">${c.done}/${c.total}</span></a>`;
      }).join('')}</div>
    </div>`;
  } else {
    warnEl.innerHTML = '';
  }

  const preview = projList.slice(0, 3);
  if (!preview.length) { projEl.innerHTML = EMPTY('진행중인 프로젝트가 없습니다'); return; }
  projEl.innerHTML = preview.map(p => {
    const c = counts[p.id] || { done: 0, total: 0 };
    let dday = '';
    if (p.target_date) {
      const diff = Math.round((parseLocalDate(p.target_date) - today0) / 86400000);
      dday = `<span class="chip ${diff <= 7 ? 'chip-danger' : 'chip-muted'}">${ddayText(diff, false)}</span>`;
    }
    return `<a href="project.html" class="proj-mini">
      <div class="proj-mini-head"><span class="proj-mini-title">${escHtml(p.title)}</span>${dday}</div>
      <div class="proj-mini-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pctOf(c)}%"></div></div>
        <span class="proj-mini-pct">${c.done}/${c.total}</span>
      </div>
    </a>`;
  }).join('');
}

// ---------- 최근 파일 ----------
function renderFiles(files, meta) {
  const el = document.getElementById('recent-files');
  const fileMeta = {}; (meta || []).forEach(m => { fileMeta[m.filename] = m; });
  const zips = (files || []).filter(f => f.name.endsWith('.zip')).slice(0, 5);
  if (!zips.length) { el.innerHTML = EMPTY('파일이 없습니다'); return; }
  el.innerHTML = `<div class="rows">${zips.map(f => {
    const m = fileMeta[f.name];
    return `<div class="file-row">
      <div class="file-ico">${FILE_ICON}</div>
      <div class="file-main">
        <div class="n">${escHtml(f.name.replace(/\.zip$/i, ''))}</div>
        ${m ? `<div class="m">${escHtml(m.year)}년 ${escHtml(m.month)}월 ${escHtml(m.day)}일 (${escHtml(m.day_of_week || '')}) ${escHtml(m.type)}</div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ---------- 민원 유형 ----------
function renderComplaintTypes(rows) {
  const el = document.getElementById('complaint-types');
  if (!rows.length) { el.innerHTML = EMPTY('이번 달 민원이 없습니다'); return; }
  const count = {};
  rows.forEach(r => { const k = r.type || '기타'; count[k] = (count[k] || 0) + 1; });
  const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = top[0][1];
  el.innerHTML = top.map(([k, n]) => `<div class="bar-row">
    <div class="bar-label" title="${escHtml(k)}">${escHtml(k)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n / max * 100)}%"></div></div>
    <div class="bar-num">${n}</div>
  </div>`).join('');
}

// ---------- 오늘 일정 (Google 캘린더 · 할일 페이지에서 연결한 설정 사용) ----------
async function loadDashCalendar(now) {
  const el = document.getElementById('dash-cal');
  const apiKey = localStorage.getItem('gcal_api_key');
  const calId = localStorage.getItem('gcal_cal_id');
  if (!apiKey || !calId) {
    el.innerHTML = `<div class="empty">구글 캘린더를 연결하면 오늘 일정이 여기에 보여요.<br><a class="panel-link" href="todo.html">할일 페이지에서 연결하기</a></div>`;
    return;
  }
  // 오늘 0시 ~ 내일 0시 (브라우저 시간대 기준)
  const tMin = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString();
  const tMax = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0).toISOString();
  try {
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?key=${apiKey}&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&singleEvents=true&orderBy=startTime`);
    if (!res.ok) { el.innerHTML = `<div class="empty" style="color:var(--danger)">일정을 불러오지 못했어요.<br><a class="panel-link" href="todo.html">할일 페이지에서 설정 확인</a></div>`; return; }
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) { el.innerHTML = EMPTY('오늘 일정이 없습니다'); return; }
    el.innerHTML = items.map(ev => {
      const s = ev.start && ev.start.dateTime ? new Date(ev.start.dateTime) : null;
      const t = s ? `${pad(s.getHours())}:${pad(s.getMinutes())}` : '종일';
      return `<div class="ev"><div class="ev-time">${t}</div><div class="ev-title">${escHtml(ev.summary || '(제목 없음)')}</div></div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:var(--danger)">일정을 불러오지 못했어요.</div>`;
  }
}

// ---------- 시작 ----------
// ---------- 바로가기 ----------
function renderTools() {
  const el = document.getElementById('dash-tools');
  if (!el || el.dataset.ready) return;
  el.dataset.ready = '1';
  el.style.setProperty('--n', Math.min(TOOL_LINKS.length, 5));   // 한 줄에 최대 5개, 넘으면 다음 줄
  el.innerHTML = TOOL_LINKS.map(t => {
    const full = t.full || t.name;
    return `<a class="tool tool-${escHtml(t.id)}" href="${escHtml(t.url)}" target="_blank" rel="noopener noreferrer" title="${escHtml(full)}">
    <span class="tool-ico" aria-hidden="true">${svgIcon(t.icon, 20)}</span>
    <span class="tool-name" aria-hidden="true">${escHtml(t.name)}</span>
    <span class="sr-only">${escHtml(full)} (새 탭에서 열림)</span>
  </a>`;
  }).join('');
}

// ---------- 디지털 시계 ----------
let clockTimer = null, clockStarted = false, clockDay = '';
function clockTick() {
  const now = new Date();
  const set = (id, v) => { const el = document.getElementById(id); if (el && el.textContent !== v) el.textContent = v; };
  set('clk-h', pad(now.getHours())); set('clk-m', pad(now.getMinutes())); set('clk-s', pad(now.getSeconds()));
  const box = document.getElementById('dash-clock');
  const label = `현재 시각 ${now.getHours()}시 ${now.getMinutes()}분`;
  if (box && box.getAttribute('aria-label') !== label) box.setAttribute('aria-label', label);
  const greet = document.getElementById('dash-greeting');
  const g = greetingFor(now.getHours());
  if (greet && greet.textContent !== g) greet.textContent = g;
  // 자정을 넘겨 켜둔 화면이면 날짜와 오늘 할일을 새로 불러옴
  const day = ymd(now);
  if (clockDay && day !== clockDay) initDashboard();
  clockSchedule();
}
function clockSchedule() {
  clearTimeout(clockTimer);
  if (document.hidden) return;                                   // 탭이 가려져 있으면 멈춤 (배터리 절약)
  clockTimer = setTimeout(clockTick, 1000 - (Date.now() % 1000) + 5);   // 정확히 초가 바뀌는 시점에 맞춤
}
function clockStart() {
  if (clockStarted) return;
  clockStarted = true;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) clockTick(); else clearTimeout(clockTimer); });
  clockTick();
}

async function initDashboard() {
  const now = new Date();
  clockDay = ymd(now);
  clockStart();
  renderTools();
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  document.getElementById('dash-date').textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
  document.getElementById('dash-greeting').textContent = greetingFor(now.getHours());

  const todayStr = ymd(now);
  const monthStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const uid = currentUser.id;

  loadDashCalendar(now);   // 일정은 따로 불러와도 됨 (다른 칸을 기다리게 하지 않음)

  const [todosR, incompleteR, monthlyR, complaintsR, projectsR, filesR, metaR] = await Promise.all([
    sb.from('todos').select('*').eq('user_id', uid).eq('date', todayStr),
    sb.from('todos').select('id').eq('user_id', uid).eq('done', false).lt('date', todayStr),
    sb.from('todos').select('id').eq('user_id', uid).eq('done', true).like('date', `${monthStr}%`),
    sb.from('complaints').select('type').eq('user_id', uid).like('date', `${monthStr}%`),
    sb.from('long_projects').select('*').eq('user_id', uid).eq('status', 'active').order('target_date', { ascending: true, nullsFirst: false }),
    sb.storage.from('exam-zips').list('', { sortBy: { column: 'created_at', order: 'desc' }, limit: 30 }),
    sb.from('file_meta').select('*')
  ]);

  // 할일: 시작 시간 순 (시간이 없는 것은 뒤로)
  todayTodos = (todosR.data || []).slice().sort((a, b) =>
    (a.start_time || '99:99').localeCompare(b.start_time || '99:99') || String(a.created_at).localeCompare(String(b.created_at)));
  updateTodoStats();
  renderTodos();

  document.getElementById('stat-incomplete').textContent = (incompleteR.data || []).length;
  monthlyDone = (monthlyR.data || []).length;
  document.getElementById('stat-monthly').textContent = monthlyDone;
  const complaintRows = complaintsR.data || [];
  document.getElementById('stat-complaint').textContent = complaintRows.length;
  renderComplaintTypes(complaintRows);

  // 프로젝트 + 마일스톤 진행률
  const projList = projectsR.data || [];
  const counts = {};
  if (projList.length) {
    const { data: ms } = await sb.from('project_milestones').select('project_id, done').in('project_id', projList.map(p => p.id));
    (ms || []).forEach(m => {
      if (!counts[m.project_id]) counts[m.project_id] = { done: 0, total: 0 };
      counts[m.project_id].total++;
      if (m.done) counts[m.project_id].done++;
    });
  }
  renderProjects(projList, counts, today0);

  renderFiles(filesR.data, metaR.data);
}
